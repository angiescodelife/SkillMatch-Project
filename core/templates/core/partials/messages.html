{% load skillmatch_tags %}
{% if messages %}<div class="messages" role="status">
    {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% else %}info{% endif %}">
        {% if message.tags == 'error' %}{% icon "circle-alert" 15 %}{% elif message.tags == 'success' %}{% icon "circle-check" 15 %}{% else %}{% icon "info" 15 %}{% endif %}
        <span>{{ message }}</span>
    </div>
    {% endfor %}
</div>{% endif %}
