# Render Blueprint: creates the web service and a PostgreSQL database.
# Dashboard → New → Blueprint → choose this repository → Apply.
databases:
  - name: skillmatch-db
    plan: free
    databaseName: skillmatch
    user: skillmatch

services:
  - type: web
    name: skillmatch
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 120
    healthCheckPath: /login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skillmatch-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: SEED_DEMO
        value: "true"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
